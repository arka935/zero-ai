<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Zero AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230A0A0F'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23FFB020' stroke-width='4'/%3E%3Cpath d='M12 32h10l4-10 8 20 4-10h14' fill='none' stroke='%23FFB020' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A0A0F;
    --panel:#12121B;
    --panel-raised:#181822;
    --line:#24242F;
    --ink:#ECECF2;
    --ink-dim:#8A8A9C;
    --signal:#FFB020;
    --signal-dim:#7A5218;
    --signal-glow: rgba(255,176,32,0.18);
    --danger:#FF6B6B;
    --font-mono:'JetBrains Mono', ui-monospace, monospace;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--font-body);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .app{display:flex; height:100vh; width:100vw;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px; min-width:280px;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:16px 12px;
    transition:transform .25s ease;
    z-index:40;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:6px 6px 16px 6px;}
  .brand-mark{width:30px; height:30px; flex:none;}
  .brand-text{display:flex; flex-direction:column; line-height:1.15;}
  .brand-title{font-family:var(--font-mono); font-weight:700; font-size:15px; letter-spacing:.06em; color:var(--ink);}
  .model-badge{
    font-family:var(--font-mono); font-size:10px; color:var(--signal);
    border:1px solid var(--signal-dim); background:var(--signal-glow);
    padding:1px 6px; border-radius:6px; width:fit-content; margin-top:3px;
    letter-spacing:.03em;
  }
  .new-chat-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    background:var(--panel-raised); color:var(--ink);
    border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; font-family:var(--font-body); font-weight:600; font-size:14px;
    cursor:pointer; margin-bottom:14px;
  }
  .new-chat-btn:hover{border-color:var(--signal-dim); color:var(--signal);}
  .new-chat-btn svg{width:16px; height:16px;}

  .history-label{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-dim);
    letter-spacing:.08em; text-transform:uppercase; padding:4px 8px 8px;
  }
  .history-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px;}
  .history-empty{color:var(--ink-dim); font-size:13px; padding:8px; line-height:1.5;}
  .history-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:9px; cursor:pointer;
    color:var(--ink-dim); font-size:13px;
  }
  .history-item:hover{background:var(--panel-raised); color:var(--ink);}
  .history-item.active{background:var(--panel-raised); color:var(--ink); border:1px solid var(--signal-dim);}
  .history-item .h-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .history-item .h-del{opacity:0; font-size:15px; padding:2px 4px; border-radius:6px;}
  .history-item:hover .h-del{opacity:1;}
  .history-item .h-del:hover{color:var(--danger);}

  .sidebar-footer{
    border-top:1px solid var(--line); margin-top:10px; padding-top:10px;
    font-size:11px; color:var(--ink-dim); font-family:var(--font-mono);
  }

  /* ---------- Main chat column ---------- */
  .chat-panel{flex:1; display:flex; flex-direction:column; min-width:0;}
  .topbar{
    display:none; align-items:center; gap:10px;
    padding:12px 14px; border-bottom:1px solid var(--line);
    background:var(--panel);
  }
  .hamburger{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line);
    background:var(--panel-raised); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none;
  }
  .hamburger svg{width:18px; height:18px; color:var(--ink);}
  .topbar .brand-title{font-size:14px;}

  .messages{
    flex:1; overflow-y:auto; padding:24px 18px 12px;
    display:flex; flex-direction:column; gap:18px;
  }
  .msg-row{display:flex; gap:10px; max-width:820px; width:100%; margin:0 auto;}
  .msg-row.user{justify-content:flex-end;}
  .avatar{
    width:28px; height:28px; flex:none; border-radius:50%;
    background:var(--panel-raised); border:1px solid var(--signal-dim);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar svg{width:16px; height:16px;}
  .bubble{
    max-width:78%; padding:12px 14px; border-radius:var(--radius);
    font-size:14.5px; line-height:1.6; word-wrap:break-word;
  }
  .msg-row.assistant .bubble{background:var(--panel-raised); border:1px solid var(--line); border-top-left-radius:4px;}
  .msg-row.user .bubble{background:var(--signal); color:#1a1200; border-top-right-radius:4px; font-weight:500;}
  .bubble img.attach-preview-img{max-width:220px; border-radius:10px; display:block; margin-bottom:8px; border:1px solid var(--line);}
  .bubble p{margin:0 0 10px;}
  .bubble p:last-child{margin-bottom:0;}
  .bubble strong{color:var(--signal); font-weight:700;}
  .msg-row.user .bubble strong{color:#1a1200; text-decoration:underline;}
  .bubble strong.mega{font-size:1.18em; display:inline-block; margin:2px 0;}
  .bubble code{
    font-family:var(--font-mono); background:rgba(255,176,32,0.12);
    padding:1px 5px; border-radius:5px; font-size:0.92em;
  }

  /* code + table both rendered as real <table> markup ("tabel") per spec */
  table.code-table, table.md-table{
    border-collapse:collapse; width:100%; margin:6px 0 10px;
    font-size:13px; overflow:hidden; border-radius:10px;
    border:1px solid var(--line); display:block; overflow-x:auto;
  }
  table.code-table tr, table.md-table tr{display:table-row;}
  table.code-table{background:#0D0D14;}
  table.code-table td{display:table-cell;}
  .code-table .ct-head{
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);
    background:var(--panel-raised); padding:7px 12px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .code-table .ct-lang{color:var(--signal); letter-spacing:.04em;}
  .code-table .ct-copy{
    background:none; border:1px solid var(--line); color:var(--ink-dim);
    font-family:var(--font-body); font-size:11px; padding:2px 8px;
    border-radius:6px; cursor:pointer;
  }
  .code-table .ct-copy:hover{color:var(--signal); border-color:var(--signal-dim);}
  .code-table .ct-body{padding:0;}
  .code-table pre{margin:0; padding:12px 14px; overflow-x:auto;}
  .code-table code{background:none; padding:0; font-size:12.8px; color:var(--ink); white-space:pre;}

  table.md-table{background:var(--panel-raised);}
  table.md-table th, table.md-table td{
    padding:7px 11px; border-bottom:1px solid var(--line); text-align:left;
    display:table-cell; white-space:nowrap;
  }
  table.md-table thead tr{display:table-row; background:rgba(255,176,32,0.08);}
  table.md-table th{color:var(--signal); font-family:var(--font-mono); font-size:12px;}

  /* Loading pulse (also = brand signature reused as typing indicator) */
  .thinking{display:flex; align-items:center; gap:10px; color:var(--ink-dim); font-size:13px;}
  .pulse-mark{width:26px; height:26px; position:relative;}
  .pulse-ring{
    width:100%; height:100%; border-radius:50%; border:2px solid var(--signal-dim);
    position:absolute; inset:0;
  }
  .pulse-ring::after{
    content:''; position:absolute; inset:-3px; border-radius:50%;
    border:2px solid var(--signal); opacity:0; animation:pulseOut 1.4s ease-out infinite;
  }
  @keyframes pulseOut{
    0%{transform:scale(.7); opacity:.9;}
    100%{transform:scale(1.6); opacity:0;}
  }
  .blip-line{position:absolute; top:50%; left:3px; right:3px; height:2px; background:var(--signal-dim); border-radius:2px;}
  .blip-dot{
    position:absolute; top:-3px; width:6px; height:8px; background:var(--signal);
    border-radius:1px; animation:blipMove 1.2s linear infinite;
  }
  @keyframes blipMove{
    0%{left:0%;} 50%{left:85%;} 100%{left:0%;}
  }
  .type-cursor{display:inline-block; width:7px; height:14px; background:var(--signal); margin-left:2px; vertical-align:-2px; animation:blink 0.85s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---------- Composer ---------- */
  .composer-wrap{padding:12px 18px 18px; background:var(--void);}
  .attach-preview{
    max-width:820px; margin:0 auto 8px; display:none;
    align-items:center; gap:10px; background:var(--panel-raised);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px;
  }
  .attach-preview img{width:40px; height:40px; object-fit:cover; border-radius:6px;}
  .attach-preview .a-name{flex:1; font-size:12px; color:var(--ink-dim); font-family:var(--font-mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .attach-preview .a-remove{cursor:pointer; color:var(--ink-dim); border:none; background:none; font-size:16px;}
  .attach-preview .a-remove:hover{color:var(--danger);}

  .composer{
    max-width:820px; margin:0 auto; display:flex; align-items:flex-end; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:8px 8px 8px 12px;
  }
  .composer textarea{
    flex:1; resize:none; background:none; border:none; outline:none;
    color:var(--ink); font-family:var(--font-body); font-size:14.5px; line-height:1.5;
    max-height:140px; padding:8px 0;
  }
  .composer textarea::placeholder{color:var(--ink-dim);}
  .icon-btn{
    width:38px; height:38px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel-raised); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex:none; color:var(--ink-dim);
  }
  .icon-btn:hover{color:var(--signal); border-color:var(--signal-dim);}
  .icon-btn svg{width:17px; height:17px;}
  .send-btn{background:var(--signal); border-color:var(--signal); color:#1a1200;}
  .send-btn:hover{background:#ffc250; color:#1a1200;}
  .send-btn:disabled{opacity:.4; cursor:not-allowed;}

  .hint{max-width:820px; margin:8px auto 0; text-align:center; font-size:11px; color:var(--ink-dim);}

  /* ---------- Mobile ---------- */
  @media (max-width: 860px){
    .topbar{display:flex;}
    .sidebar{
      position:fixed; top:0; left:0; height:100%;
      transform:translateX(-100%);
      box-shadow:20px 0 40px rgba(0,0,0,.5);
    }
    .sidebar.open{transform:translateX(0);}
    .overlay{
      position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30;
      opacity:0; pointer-events:none; transition:opacity .2s ease;
    }
    .overlay.show{opacity:1; pointer-events:auto;}
    .bubble{max-width:88%;}
  }
</style>
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#FFB020" stroke-width="4"/><path d="M12 32h10l4-10 8 20 4-10h14" fill="none" stroke="#FFB020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="brand-text">
        <span class="brand-title">ZERO AI</span>
        <span class="model-badge">Zero-Mark1</span>
      </div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
      Obrolan Baru
    </button>

    <div class="history-label">Riwayat</div>
    <div class="history-list" id="historyList"></div>

    <div class="sidebar-footer">Zero AI · lokal di perangkatmu</div>
  </aside>

  <main class="chat-panel">
    <div class="topbar">
      <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/></svg>
      </button>
      <span class="brand-title">ZERO AI</span>
      <span class="model-badge">Zero-Mark1</span>
    </div>

    <div class="messages" id="messages"></div>

    <div class="composer-wrap">
      <div class="attach-preview" id="attachPreview">
        <img id="attachPreviewImg" src="" alt="" />
        <span class="a-name" id="attachName"></span>
        <button class="a-remove" id="attachRemove">✕</button>
      </div>
      <div class="composer">
        <input type="file" id="imageInput" accept="image/png, image/jpeg" hidden />
        <button class="icon-btn" id="attachBtn" aria-label="Lampirkan gambar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5V7a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v10a4 4 0 0 0 4 4h7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M4 16l4.5-4.5a2 2 0 0 1 2.8 0L15 15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="18" r="3.2"/><path d="M18 16.6v2.8M16.6 18h2.8" stroke-linecap="round"/></svg>
        </button>
        <textarea id="messageInput" rows="1" placeholder="Tulis pesan ke Zero..."></textarea>
        <button class="icon-btn send-btn" id="sendBtn" aria-label="Kirim">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="hint">Enter untuk kirim · Shift+Enter untuk baris baru</div>
    </div>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ============ Config ============ */
  const API_ENDPOINT = "/.netlify/functions/chat";
  const DISPLAY_MODEL_NAME = "Zero-Mark1"; // fixed label shown in UI, not editable
  const STORAGE_KEY = "zero-ai-sessions-v1";
  const SYSTEM_PROMPT =
    "Kamu adalah Zero AI, asisten AI yang ramah, jelas, dan efisien. " +
    "Format balasanmu dengan Markdown ringan: pakai **teks** untuk menebalkan kata/frasa penting, " +
    "dan ***teks*** untuk penekanan yang lebih kuat (judul singkat atau poin paling penting) — jangan berlebihan memakainya. " +
    "Saat data lebih jelas dalam bentuk tabel, gunakan tabel Markdown (format | kolom | kolom |). " +
    "Saat menulis kode, selalu bungkus dalam code block Markdown bertanda bahasa, contoh ```javascript ... ```. " +
    "Jawab dalam bahasa yang dipakai pengguna, dan usahakan jawaban padat serta mudah dibaca di layar kecil.";

  /* ============ State ============ */
  let sessions = loadSessions();
  let currentId = sessions.length ? sessions[0].id : createSession();
  let pendingImage = null; // {dataUrl, name}
  let isSending = false;

  /* ============ Elements ============ */
  const el = {
    sidebar: document.getElementById("sidebar"),
    overlay: document.getElementById("overlay"),
    hamburger: document.getElementById("hamburgerBtn"),
    newChat: document.getElementById("newChatBtn"),
    historyList: document.getElementById("historyList"),
    messages: document.getElementById("messages"),
    input: document.getElementById("messageInput"),
    sendBtn: document.getElementById("sendBtn"),
    attachBtn: document.getElementById("attachBtn"),
    imageInput: document.getElementById("imageInput"),
    attachPreview: document.getElementById("attachPreview"),
    attachPreviewImg: document.getElementById("attachPreviewImg"),
    attachName: document.getElementById("attachName"),
    attachRemove: document.getElementById("attachRemove"),
  };

  /* ============ Storage helpers ============ */
  function loadSessions(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){ return []; }
  }
  function saveSessions(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions)); }catch(e){ /* storage full/blocked, ignore */ }
  }
  function createSession(){
    const s = { id: "s_" + Date.now() + "_" + Math.random().toString(36).slice(2,7), title: "Chat baru", createdAt: Date.now(), messages: [] };
    sessions.unshift(s);
    saveSessions();
    return s.id;
  }
  function getSession(id){ return sessions.find(s => s.id === id); }

  /* ============ Sidebar ============ */
  function renderHistory(){
    el.historyList.innerHTML = "";
    if(!sessions.length){
      const empty = document.createElement("div");
      empty.className = "history-empty";
      empty.textContent = "Belum ada riwayat obrolan";
      el.historyList.appendChild(empty);
      return;
    }
    sessions.forEach(s => {
      const item = document.createElement("div");
      item.className = "history-item" + (s.id === currentId ? " active" : "");
      const title = document.createElement("span");
      title.className = "h-title";
      title.textContent = s.title || "Chat baru";
      const del = document.createElement("button");
      del.className = "h-del";
      del.textContent = "✕";
      del.title = "Hapus";
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        if(confirm("Hapus obrolan ini?")){
          sessions = sessions.filter(x => x.id !== s.id);
          if(currentId === s.id){
            currentId = sessions.length ? sessions[0].id : createSession();
          }
          saveSessions();
          renderHistory();
          renderMessages();
        }
      });
      item.appendChild(title);
      item.appendChild(del);
      item.addEventListener("click", () => {
        currentId = s.id;
        renderHistory();
        renderMessages();
        closeSidebarMobile();
      });
      el.historyList.appendChild(item);
    });
  }

  function closeSidebarMobile(){
    el.sidebar.classList.remove("open");
    el.overlay.classList.remove("show");
  }

  el.hamburger.addEventListener("click", () => {
    el.sidebar.classList.toggle("open");
    el.overlay.classList.toggle("show");
  });
  el.overlay.addEventListener("click", closeSidebarMobile);

  el.newChat.addEventListener("click", () => {
    currentId = createSession();
    renderHistory();
    renderMessages();
    closeSidebarMobile();
    el.input.focus();
  });

  /* ============ Mini Markdown renderer ============ */
  function escapeHtml(str){
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function closeDangling(raw){
    // keep code fences balanced while text is still streaming in via the typewriter effect
    const fenceCount = (raw.match(/```/g) || []).length;
    if(fenceCount % 2 === 1) return raw + "\n```";
    return raw;
  }

  function renderMarkdown(raw){
    // 1) escape the ENTIRE raw text once, up front. Everything built below
    // (tables, code cards, bold) is assembled on top of this already-safe
    // text, so nothing ever gets escaped twice and nothing skips escaping.
    let text = escapeHtml(closeDangling(raw));

    // 2) pull out code blocks so bold/table rules below can't touch their content
    const codeBlocks = [];
    text = text.replace(/```(\w+)?\n?([\s\S]*?)```/g, (m, lang, code) => {
      const idx = codeBlocks.length;
      codeBlocks.push({ lang: (lang || "text").toLowerCase(), code: code.replace(/\n$/, "") });
      return "\u0000CODE" + idx + "\u0000";
    });

    // 3) markdown pipe tables -> real <table> ("tabel chat")
    text = text.replace(/(^\|.+\|[ \t]*\n\|[ \t:\-\|]+\|[ \t]*\n(?:\|.*\|[ \t]*\n?)*)/gm, (block) => {
      const lines = block.trim().split("\n").filter(Boolean);
      const header = lines[0].split("|").slice(1,-1).map(c => c.trim());
      const rows = lines.slice(2).map(l => l.split("|").slice(1,-1).map(c => c.trim()));
      let html = '<table class="md-table"><thead><tr>' +
        header.map(h => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>";
      rows.forEach(r => {
        html += "<tr>" + r.map(c => "<td>" + c + "</td>").join("") + "</tr>";
      });
      html += "</tbody></table>";
      return html;
    });

    // 4) bold: *** first (mega), then **
    text = text.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong class="mega">$1</strong>');
    text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

    // 5) inline code
    text = text.replace(/`([^`]+)`/g, "<code>$1</code>");

    // 6) paragraphs / line breaks (skip lines that are already table html)
    text = text.split(/\n{2,}/).map(block => {
      if(block.trim().startsWith("<table")) return block;
      return "<p>" + block.replace(/\n/g, "<br>") + "</p>";
    }).join("");

    // 7) restore code blocks as real <table> "code tables" (content is already escaped from step 1)
    text = text.replace(/\u0000CODE(\d+)\u0000/g, (m, idx) => {
      const cb = codeBlocks[idx];
      return (
        '<table class="code-table"><tr><td class="ct-head">' +
        '<span class="ct-lang">' + cb.lang + '</span>' +
        '<button class="ct-copy" onclick="window.__zeroCopy(this)">Copy</button>' +
        '</td></tr><tr><td class="ct-body"><pre><code>' + cb.code + '</code></pre></td></tr></table>'
      );
    });

    return text;
  }

  window.__zeroCopy = function(btn){
    const codeEl = btn.closest("table").querySelector("code");
    const text = codeEl ? codeEl.textContent : "";
    navigator.clipboard.writeText(text).then(() => {
      const old = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = old; }, 1200);
    }).catch(() => {});
  };

  /* ============ Rendering messages ============ */
  const AVATAR_SVG = '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#FFB020" stroke-width="5"/><path d="M12 32h10l4-10 8 20 4-10h14" fill="none" stroke="#FFB020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function scrollToBottom(){
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function renderMessages(){
    el.messages.innerHTML = "";
    const s = getSession(currentId);
    if(!s) return;
    s.messages.forEach(m => appendMessageEl(m.role, m.content, m.image, false));
    scrollToBottom();
  }

  function appendMessageEl(role, content, image, animate){
    const row = document.createElement("div");
    row.className = "msg-row " + role;

    if(role === "assistant"){
      const av = document.createElement("div");
      av.className = "avatar";
      av.innerHTML = AVATAR_SVG;
      row.appendChild(av);
    }

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    if(image){
      const img = document.createElement("img");
      img.className = "attach-preview-img";
      img.src = image;
      bubble.appendChild(img);
    }

    const textWrap = document.createElement("div");
    textWrap.className = "bubble-text";
    bubble.appendChild(textWrap);

    row.appendChild(bubble);
    el.messages.appendChild(row);
    scrollToBottom();

    if(animate){
      typewriter(textWrap, content);
    }else{
      textWrap.innerHTML = renderMarkdown(content || "");
    }
    return { row, bubble, textWrap };
  }

  function typewriter(container, fullText){
    let i = 0;
    const len = fullText.length;
    const stepChars = Math.max(1, Math.ceil(len / 260)); // scale speed so long code isn't painfully slow
    const intervalMs = 14;
    const cursor = document.createElement("span");
    cursor.className = "type-cursor";

    function tick(){
      i = Math.min(len, i + stepChars);
      container.innerHTML = renderMarkdown(fullText.slice(0, i));
      container.appendChild(cursor);
      scrollToBottom();
      if(i < len){
        setTimeout(tick, intervalMs);
      }else{
        cursor.remove();
        container.innerHTML = renderMarkdown(fullText);
      }
    }
    tick();
  }

  /* ============ Loading indicator ============ */
  function showThinking(){
    const row = document.createElement("div");
    row.className = "msg-row assistant";
    row.id = "thinkingRow";
    const av = document.createElement("div");
    av.className = "avatar";
    av.innerHTML = AVATAR_SVG;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML =
      '<div class="thinking"><span class="pulse-mark"><span class="pulse-ring"></span><span class="blip-line"><span class="blip-dot"></span></span></span> Zero sedang mengetik...</div>';
    row.appendChild(av);
    row.appendChild(bubble);
    el.messages.appendChild(row);
    scrollToBottom();
  }
  function hideThinking(){
    const row = document.getElementById("thinkingRow");
    if(row) row.remove();
  }

  /* ============ Attach image ============ */
  el.attachBtn.addEventListener("click", () => el.imageInput.click());
  el.imageInput.addEventListener("change", () => {
    const file = el.imageInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImage = { dataUrl: reader.result, name: file.name };
      el.attachPreviewImg.src = pendingImage.dataUrl;
      el.attachName.textContent = file.name;
      el.attachPreview.style.display = "flex";
    };
    reader.readAsDataURL(file);
    el.imageInput.value = "";
  });
  el.attachRemove.addEventListener("click", () => {
    pendingImage = null;
    el.attachPreview.style.display = "none";
  });

  /* ============ Sending ============ */
  el.input.addEventListener("input", () => {
    el.input.style.height = "auto";
    el.input.style.height = Math.min(140, el.input.scrollHeight) + "px";
  });
  el.input.addEventListener("keydown", (e) => {
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      sendMessage();
    }
  });
  el.sendBtn.addEventListener("click", sendMessage);

  function buildApiMessages(session){
    const api = [{ role: "system", content: SYSTEM_PROMPT }];
    session.messages.forEach(m => {
      if(m.image){
        api.push({
          role: m.role,
          content: [
            { type: "text", text: m.content || "" },
            { type: "image_url", image_url: { url: m.image } }
          ]
        });
      }else{
        api.push({ role: m.role, content: m.content });
      }
    });
    return api;
  }

  async function sendMessage(){
    if(isSending) return;
    const text = el.input.value.trim();
    if(!text && !pendingImage) return;

    const s = getSession(currentId);
    if(!s) return;

    const userMsg = { role: "user", content: text, image: pendingImage ? pendingImage.dataUrl : null };
    s.messages.push(userMsg);
    if(s.messages.length === 1){
      s.title = (text || "Gambar terlampir").slice(0, 40);
    }
    saveSessions();
    renderHistory();
    appendMessageEl("user", text, userMsg.image, false);

    el.input.value = "";
    el.input.style.height = "auto";
    pendingImage = null;
    el.attachPreview.style.display = "none";

    isSending = true;
    el.sendBtn.disabled = true;
    showThinking();

    try{
      const res = await fetch(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: buildApiMessages(s) })
      });

      const data = await res.json().catch(() => ({}));
      hideThinking();

      if(!res.ok){
        const errText = (data && data.error) ? data.error : ("HTTP " + res.status);
        appendMessageEl("assistant", "⚠️ Zero gagal membalas: " + errText, null, false);
      }else{
        const reply = data.reply || "(kosong)";
        s.messages.push({ role: "assistant", content: reply, image: null });
        saveSessions();
        appendMessageEl("assistant", reply, null, true);
      }
    }catch(err){
      hideThinking();
      appendMessageEl("assistant", "⚠️ Zero gagal membalas: " + (err && err.message ? err.message : "koneksi bermasalah") + ". Coba lagi.", null, false);
    }finally{
      isSending = false;
      el.sendBtn.disabled = false;
    }
  }

  /* ============ Init ============ */
  renderHistory();
  renderMessages();
})();
</script>
</body>
</html>
